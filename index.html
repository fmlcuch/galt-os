// 1. MECHANICKÝ TYPEWRITER (Vykreslování textu)
async function typeWriter(elementId, text, minSpeed = 10, maxSpeed = 30) {
    const el = document.getElementById(elementId);
    if (!el || !text) return;
    el.innerHTML = '';
    for (let i = 0; i < text.length; i++) {
        el.innerHTML += text.charAt(i);
        const speed = Math.floor(Math.random() * (maxSpeed - minSpeed)) + minSpeed;
        await new Promise(r => setTimeout(r, speed));
    }
}

// 2. DYNAMICKÉ HODINY (Reálný čas v terminálu)
function updateClock() {
    const clockEl = document.getElementById('galt-clock');
    if (!clockEl) return;
    const now = new Date();
    const timeString = now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    const isDST = now.getTimezoneOffset() < -60; 
    clockEl.innerText = timeString + (isDST ? ' CEST' : ' CET');
}

// 3. TRHAVÉ NASKAKOVÁNÍ ČÍSEL (Pro horní metriky)
function animateValue(id, start, end, duration, suffix = "") {
    const obj = document.getElementById(id);
    if (!obj) return;
    const frameRate = 40; 
    const totalFrames = Math.round(duration / frameRate);
    let frame = 0;

    const counter = setInterval(() => {
        frame++;
        const progress = 1 - Math.pow(1 - (frame / totalFrames), 3);
        const current = start + (end - start) * progress;
        
        // Změna: Pouze energie (met-nrg) zůstává celým číslem. 
        // CZK (kurz) a inflace teď budou mít desetinná místa.
        if (id === 'met-nrg') {
            obj.innerHTML = Math.round(current) + suffix;
        } else {
            obj.innerHTML = current.toFixed(2) + suffix; // .toFixed(2) pro hezčí kurz měny
        }

        if (frame >= totalFrames) {
            clearInterval(counter);
            if (id === 'met-nrg') {
                obj.innerHTML = Math.round(end) + suffix;
            } else {
                obj.innerHTML = end.toFixed(2) + suffix; 
            }
        }
    }, frameRate);
}

// 4. JEDNORÁZOVÝ GLITCH PANELU (Aktivuje se při přepnutí zprávy)
function triggerInterference() {
    const panel = document.querySelector('.galt-panel');
    if (!panel) return;
    
    // 1. Přidáme CSS třídu, která spustí tvou @keyframes animaci
    panel.classList.add('panel-glitch-active');
    
    // 2. Po skončení animace (400ms) třídu zase odebereme
    setTimeout(() => {
        panel.classList.remove('panel-glitch-active');
    }, 400); 
}
    
// 5. LOGIKA OVLÁDÁNÍ NOVINEK
let allNews = [];
let currentIndex = 0;
let isTyping = false;

async function displayNews(index) {
    if (isTyping || !allNews[index]) return;
    
    // Spuštění vizuálního rušení při načítání
    triggerInterference(); 
    isTyping = true;

    const item = allNews[index];
    const feed = document.getElementById('galt-feed');
    const navInfo = document.getElementById('nav-info');
    
    // Zajištění funkčního URL i když se jmenuje link nebo url
    const externalLink = item.url || item.link || '#';
    
    // Aktualizace stavového počitadla
    if (navInfo) navInfo.innerText = `LOG_ID: ${index + 1}/${allNews.length}`;

    // Vyčištění a příprava struktury pro Typewriter
    feed.innerHTML = `
      <div class="log-item">
        <div class="log-header cursor" id="t-active" 
             onclick="if('${externalLink}' !== '#') window.open('${externalLink}', '_blank')" 
             style="cursor: pointer; transition: 0.2s;" 
             title="OPEN_ORIGINAL_SOURCE"></div>
        <div class="columns-wrapper">
          <div class="col col-raw">
            <small style="opacity:0.6; color:var(--hud-cyan);">[SOURCE_RSS_DATA]:</small><br>
            <span id="o-active"></span>
          </div>
          <div class="col col-decoded">
            <small style="opacity:0.6; color:var(--hud-cyan);">[GALT_DECODED_TRUTH]:</small><br>
            <span id="s-active"></span>
            <div class="prop-meter"><div class="prop-bar" id="p-bar" style="width:0%"></div></div>
            
            <div class="prop-label" id="btn-reason" onclick="toggleReasoning()" style="cursor: pointer; transition: 0.2s; margin-top:5px;">
              > Propaganda level: ${item.propaganda}% <span style="color:var(--hud-alert); font-size:0.8em; margin-left: 10px; animation: blink 1.5s infinite;">[ANALYZE]</span>
            </div>
            <div id="reason-box" style="display:none; margin-top: 15px; padding: 10px; border-left: 2px solid var(--hud-alert); background: rgba(255, 60, 0, 0.05);">
              <small style="color:var(--hud-alert);">[SYSTEM_ANALYSIS]:</small><br>
              <span id="r-active" style="color: var(--hud-cyan-dim); font-size: 0.9em;"></span>
            </div>
            </div>
        </div>
      </div>
    `;

    // Sekvenční výpis (Titulek -> Zdroj -> Dekódovaná pravda)
    await typeWriter('t-active', `// SUBJECT: ${item.title}`, 10, 20);
    document.getElementById('t-active').classList.remove('cursor');
    
    await typeWriter('o-active', item.description, 1, 5); 
    await typeWriter('s-active', item.sum, 5, 15);
    
    // Plynulý nárůst ukazatele propagandy
    setTimeout(() => {
        const bar = document.getElementById('p-bar');
        if (bar) bar.style.width = `${item.propaganda}%`;
    }, 100);

    isTyping = false;
}

// 5.5 FUNKCE PRO VYSVĚTLENÍ PROPAGANDY
async function toggleReasoning() {
    if (isTyping) return;
    
    const box = document.getElementById('reason-box');
    const content = document.getElementById('r-active');
    const currentItem = allNews[currentIndex];
    const reasonText = (currentItem && currentItem.reason) ? currentItem.reason : "ERR_NO_DATA";

    if (box.style.display === 'none') {
        box.style.display = 'block';
        triggerInterference();
        isTyping = true;
        content.innerHTML = ''; 
        
        // AUTO-SCROLL: Pošle stránku mírně dolů, aby byla analýza vidět
        setTimeout(() => {
            box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);

        await typeWriter('r-active', reasonText, 5, 20);
        isTyping = false;
    } else {
        box.style.display = 'none';
        content.innerHTML = '';
    }
}

// Funkce pro navigaci
function nextNews() {
    if (currentIndex < allNews.length - 1 && !isTyping) {
        currentIndex++;
        displayNews(currentIndex);
    }
}

function prevNews() {
    if (currentIndex > 0 && !isTyping) {
        currentIndex--;
        displayNews(currentIndex);
    }
}

// Mapování klávesových šipek (opraveno pro scrollování)
document.addEventListener('keydown', (e) => {
    // Pokud uživatel mačká šipky nahoru/dolů, nebudeme do toho zasahovat
    if (e.key === "ArrowRight") {
        e.preventDefault(); // Zabráníme jen bočnímu posunu, pokud by tam byl
        nextNews();
    }
    if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevNews();
    }
});

// Společné nastavení pro generování obrázku
const canvasOptions = {
    backgroundColor: "#0a1219", // Temné pozadí
    scale: 2,                  // Vysoké rozlišení
    useCORS: true,
    onclone: (clonedDoc) => {
        const clonedPanel = clonedDoc.querySelector('.galt-panel');
        if (clonedPanel) {
            clonedPanel.style.background = "#0a1219"; // Vynucená tma pro export
            clonedPanel.style.padding = "20px";
            clonedPanel.style.borderRadius = "12px";
        }
    }
};

// FUNKCE 1: Pouze stažení obrázku (PNG)
async function downloadImage() {
    const panel = document.querySelector('.galt-panel');
    const btn = event.target;
    
    btn.innerText = "[ ARCHIVING... ]";
    triggerInterference();

    try {
        const canvas = await html2canvas(panel, canvasOptions);
        const link = document.createElement('a');
        link.download = `GALT_LOG_${currentIndex + 1}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        btn.innerText = "[ ARCHIVE_DATA ]";
    } catch (err) {
        console.error(err);
        btn.innerText = "[ ERR_ARCHIVE ]";
    }
}

// FUNKCE 2: Přímé sdílení obrázku s odkazem
async function shareExfiltration() {
    const panel = document.querySelector('.galt-panel');
    const btn = event.target;
    
    btn.innerText = "[ PREPARING... ]";
    triggerInterference();

    try {
        const canvas = await html2canvas(panel, canvasOptions);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = new File([blob], `GALT_LOG_${currentIndex + 1}.png`, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                files: [file],
                title: 'GALT OS - DECODED',
                text: 'Detekována manipulace. Fakta zde: https://whoisjohngalt.cz',
            });
            btn.innerText = "[ EXFILTRATE_DATA ]";
        } else {
            // Pokud prohlížeč neumí share, aspoň to stáhneme
            downloadImage();
            alert("ACCESS_DENIED: Sdílení souborů není podporováno. Data byla uložena lokálně.");
        }
    } catch (err) {
        console.error(err);
        btn.innerText = "[ ERR_XFER ]";
    }
}
              
function shareToX() {
    const item = allNews[currentIndex];
    const text = encodeURIComponent(`GALT_OS // DEKÓDOVANÁ PRAVDA: ${item.sum} #GaltOS #Truth`);
    const url = encodeURIComponent("https://whoisjohngalt.cz");
    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
}

function shareToFB() {
    const url = encodeURIComponent("https://whoisjohngalt.cz");
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
}
              
              
// 6. INITIAL BOOTSTRAP (Spuštění celého systému)
async function bootEngine() {
    // Spuštění hodin (každou vteřinu)
    updateClock();
    setInterval(updateClock, 1000);

    try {
        const response = await fetch('https://gist.githubusercontent.com/fmlcuch/7b5a33c34900352521e5a9b4d3a33d77/raw/galt-data.json?v=' + Date.now());
        if (!response.ok) throw new Error('CONNECTION_LOST');
        
        const data = await response.json();
        allNews = data.news; 

        // Spuštění animací čísel v horní liště
        if (data.metrics) {
            animateValue('met-inf', 0, data.metrics.inf, 1000, " %");
            animateValue('met-czk', 20, data.metrics.czk, 1200, "");
            animateValue('met-nrg', 0, data.metrics.nrg, 1500, " CZK");
        }

        // Automatické zobrazení prvního záznamu po bootu
        if (allNews.length > 0) {
            displayNews(0);
        }
    } catch (err) {
        const feed = document.getElementById('galt-feed');
        if (feed) feed.innerHTML = `> <span style="color:var(--hud-alert)">SYSTEM_ERROR: ${err.message}</span>`;
    }
}

// Spuštění při načtení stránky
document.addEventListener('DOMContentLoaded', bootEngine);</script></body></html>
