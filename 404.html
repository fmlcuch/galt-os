            }
        }</script><script>// 1. MECHANICKÝ TYPEWRITER (Trhavější psaní s drobnou náhodností)
async function typeWriter(elementId, text) {
    const el = document.getElementById(elementId);
    if (!el) return;
    el.innerHTML = '';
    for (let i = 0; i < text.length; i++) {
        el.innerHTML += text.charAt(i);
        // Náhodná prodleva 10-40ms simuluje starý buffer
        const speed = Math.floor(Math.random() * 30) + 10;
        await new Promise(r => setTimeout(r, speed));
    }
}

// 2. DYNAMICKÉ HODINY (ČESKÝ ČAS)
function updateClock() {
    const clockEl = document.getElementById('galt-clock');
    if (!clockEl) return;
    const now = new Date();
    const timeString = now.toLocaleTimeString('cs-CZ', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    const isDST = now.getTimezoneOffset() < -60; 
    clockEl.innerText = timeString + (isDST ? ' CEST' : ' CET');
}

// 3. TRHAVÉ NASKAKOVÁNÍ ČÍSEL (Hardware style)
function animateValue(id, start, end, duration, suffix = "") {
    const obj = document.getElementById(id);
    if (!obj) return;
    
    // Používáme setInterval místo plynulého requestAnimationFrame
    const frameRate = 40; // Aktualizace každých 40ms = viditelné "přeskakování"
    const totalFrames = Math.round(duration / frameRate);
    let frame = 0;

    const counter = setInterval(() => {
        frame++;
        // Křivka ease-out, ale trhaná
        const progress = 1 - Math.pow(1 - (frame / totalFrames), 3);
        const current = start + (end - start) * progress;
        
        obj.innerHTML = current.toFixed(1) + suffix;

        if (frame >= totalFrames) {
            clearInterval(counter);
            obj.innerHTML = end.toFixed(1) + suffix; // Finální hodnota natvrdo
        }
    }, frameRate);
}

// 4. MIKRO-SEKUNDOVÝ GLITCH PANELU (JS)
function triggerInterference() {
    const panel = document.querySelector('.galt-panel');
    if (!panel) return;

    // Náhodně mezi 5 a 15 sekundami
    const randomTime = Math.random() * 10000 + 5000;

    setTimeout(() => {
        // Okamžitý aplikovaný inline styl (žádná transition guma tu už v CSS neexistuje)
        panel.style.transform = `translate(${(Math.random() - 0.5) * 30}px, ${(Math.random() - 0.5) * 10}px)`;
        panel.style.filter = `hue-rotate(180deg) contrast(3) brightness(1.5)`;
        
        // Zpět do normálu za pouhých 40ms! (Oko to jen stěží zachytí)
        setTimeout(() => {
            panel.style.transform = 'none';
            panel.style.filter = 'none';
            triggerInterference(); // Zacyklení
        }, 40); 
        
    }, randomTime);
}

// 5. HLAVNÍ BOOT ENGINE
async function bootEngine() {
    updateClock();
    setInterval(updateClock, 1000);
    triggerInterference();

    const bootText = document.getElementById('boot-text');
    if (bootText) {
        await typeWriter('boot-text', '> INITIALIZING SECURE DATA FETCH...');
    }

    try {
        // STAŽENÍ REÁLNÝCH DAT (přidáváme časové razítko, aby se předešlo mezipaměti)
        const response = await fetch('/contents/galt-data.json?v=' + Date.now());
        if (!response.ok) throw new Error('DATA_UNAVAILABLE');
        const data = await response.json();

        await new Promise(r => setTimeout(r, 600));

        // Animace stažených metrik
        animateValue('met-inf', 0, data.metrics.inf, 1000, " %");
        animateValue('met-czk', 20, data.metrics.czk, 1200, "");
        animateValue('met-nrg', 0, data.metrics.nrg, 1500, " €");

        const feed = document.getElementById('galt-feed');
        if (!feed) return;
        feed.innerHTML = ''; 

        for (const [index, item] of data.news.entries()) {
            const div = document.createElement('div');
            div.className = 'log-item';
            const tId = `t-${index}`, sId = `s-${index}`;
            div.innerHTML = `
                <div class="log-meta">DATA_STREAM // ID_${Math.random().toString(16).slice(2,6).toUpperCase()}</div>
                <div class="log-title cursor" id="${tId}"></div>
                <div class="log-summary" id="${sId}"></div>
            `;
            feed.appendChild(div);
            
            await typeWriter(tId, `> ${item.title}`);
            document.getElementById(tId).classList.remove('cursor');
            document.getElementById(sId).classList.add('cursor');
            await typeWriter(sId, item.sum);
            document.getElementById(sId).classList.remove('cursor');
        }
    } catch (err) {
        if (bootText) bootText.innerHTML = `> <span style="color:red">ERROR: ${err.message}</span>`;
    }
}
document.addEventListener('DOMContentLoaded', bootEngine);</script></body></html>
